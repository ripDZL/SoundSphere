<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "JetBrains Mono";
    src: url("../../SoundSphere-1.3/fonts/JetBrainsMono-ExtraBold.woff2") format("woff2");
    font-weight: 800;
  }
  :root { --bg: #0b1018; --surface: #121a26; --border: #2b394d; --text: #eef4f8; --muted: #93a4b7; --accent: #00d084; --accent-2: #7c8cff; }
  html, body { margin: 0; width: 1280px; height: 640px; background: var(--bg); overflow: hidden; }
  body {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 82% 50%, rgba(124, 140, 255, 0.18), transparent 60%),
      radial-gradient(700px 420px at 10% 100%, rgba(0, 208, 132, 0.12), transparent 60%),
      var(--bg);
    display: grid;
    grid-template-columns: 1fr 380px;
    align-items: center;
    gap: 64px;
    padding: 0 96px;
    box-sizing: border-box;
  }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 84px; height: auto; }
  h1 { margin: 0; font-size: 68px; line-height: 1; color: var(--accent); letter-spacing: -1px; }
  .tagline { margin: 28px 0 36px; font-size: 26px; line-height: 1.4; color: var(--text); max-width: 620px; }
  .tagline span { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
    padding: 10px 18px; font-size: 18px; color: var(--text);
  }
  .chip b { color: var(--accent); font-weight: 800; }
  .shot {
    width: 380px; border-radius: 18px; border: 1px solid var(--border);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 8px rgba(18, 26, 38, 0.6);
    transform: rotate(-2deg);
  }
</style>
</head>
<body>
  <div>
    <div class="brand">
      <img src="../../logo.png" alt="">
      <h1>SoundSphere</h1>
    </div>
    <p class="tagline">Per-tab volume booster and 10-band EQ.<br><span>All processing stays in your browser.</span></p>
    <div class="chips">
      <div class="chip"><b>800%</b> boost</div>
      <div class="chip"><b>10-band</b> EQ</div>
      <div class="chip">Voice &amp; Bass modes</div>
      <div class="chip">Chrome &middot; Firefox</div>
    </div>
  </div>
  <img class="shot" src="../screenshots/popup.png" alt="">
</body>
</html>
